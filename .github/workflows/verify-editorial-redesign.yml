name: Verify editorial redesign

on:
  push:
    branches:
      - feat/mobile-editorial-reference

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build:assets
