name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build static assets
        run: npm run build:assets
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/react/legacy-controller.js
          node --check src/worker.js
      - name: Run tests
        run: npm test
      - name: Verify generated Worker bundle
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- app.js public/ src/static-content.js
      - name: Commit generated assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- app.js public/ src/static-content.js; then
            echo "Generated assets are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/static-content.js
          git add -f public/
          git commit -m "chore: sync generated React assets [skip ci]"
          git push
      - name: Validate D1 migrations with SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          connection = sqlite3.connect(":memory:")
          for migration in sorted(Path("migrations").glob("*.sql")):
              connection.executescript(migration.read_text())
          tables = [row[0] for row in connection.execute(
              "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
          )]
          expected = ["editor_credentials", "editor_login_attempts", "editor_sessions", "editor_stories", "owner_state", "story_responses", "story_social_actions"]
          assert tables == expected, (tables, expected)
          print("Migration tables:", tables)
          PY
