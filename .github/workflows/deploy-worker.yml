name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDITOR_PASSWORD_HASH: ${{ secrets.EDITOR_PASSWORD_HASH }}
      SOCIAL_SECRET: ${{ secrets.SOCIAL_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$EDITOR_PASSWORD_HASH" || { echo "Missing EDITOR_PASSWORD_HASH"; exit 1; }
          test -n "$SOCIAL_SECRET" || { echo "Missing SOCIAL_SECRET"; exit 1; }
      - name: Build assets
        run: npm run build:assets
      - name: Apply remote D1 migrations
        run: wrangler d1 migrations apply medium-inspired-site-state --remote --config wrangler.jsonc
      - name: Set Worker secrets
        run: |
          printf '%s' "$EDITOR_PASSWORD_HASH" | wrangler secret put EDITOR_PASSWORD_HASH --config wrangler.jsonc
          printf '%s' "$SOCIAL_SECRET" | wrangler secret put SOCIAL_SECRET --config wrangler.jsonc
      - name: Deploy Worker
        run: wrangler deploy --config wrangler.jsonc
      - name: Smoke test Worker
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2             "https://medium-inspired-site.andregsman.workers.dev/api/stories"             -o /tmp/stories.json
          python3 - <<'PY'
          import json
          with open("/tmp/stories.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert isinstance(payload.get("stories"), list), payload
          print("Worker API OK; published stories:", len(payload["stories"]))
          PY
